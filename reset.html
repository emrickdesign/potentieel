<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — Potentieel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: var(--bg); margin: 0; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(20,15,5,0.08);
    }
    .auth-logo { text-align: center; margin-bottom: 36px; }
    .auth-logo a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 17px; letter-spacing: 1px; color: var(--white); }
    .auth-card h2 { font-size: 22px; font-weight: 700; margin: 0 0 6px; color: var(--white); }
    .auth-sub { color: var(--gray); font-size: 13px; margin: 0 0 28px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--gray); margin-bottom: 6px; }
    .form-group input {
      width: 100%; box-sizing: border-box;
      background: var(--bg-card-3);
      border: 1px solid var(--border-card);
      border-radius: 10px; padding: 12px 16px;
      color: var(--white); font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--orange); }
    .btn-login {
      width: 100%; padding: 13px; border-radius: 10px;
      background: var(--orange); color: #fff;
      border: none; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: opacity .2s;
    }
    .btn-login:hover { opacity: .88; }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }
    .auth-err { color: #c8433f; font-size: 12px; margin-top: 10px; display: none; }
    .auth-footer { margin-top: 24px; text-align: center; font-size: 13px; color: var(--gray); }
    .auth-footer a { color: var(--orange); text-decoration: none; }
    .auth-state { color: var(--gray); font-size: 13px; text-align: center; }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--orange,#f4926a);border-radius:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
          </svg>
        </span>
        POTENTIEEL
      </a>
    </div>

    <h2>Nouveau mot de passe</h2>
    <p class="auth-sub">Choisissez un nouveau mot de passe pour votre compte.</p>

    <!-- Chargement / vérification du lien -->
    <p class="auth-state" id="stateMsg">Vérification du lien…</p>

    <!-- Formulaire (affiché seulement si le lien de réinitialisation est valide) -->
    <form id="resetForm" onsubmit="handleReset(event)" style="display:none">
      <div class="form-group">
        <label for="pwd1">Nouveau mot de passe</label>
        <input type="password" id="pwd1" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <div class="form-group">
        <label for="pwd2">Confirmez le mot de passe</label>
        <input type="password" id="pwd2" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn-login" id="resetBtn">Enregistrer →</button>
      <div class="auth-err" id="resetErr"></div>
    </form>

    <p class="auth-footer">
      <a href="auth.html">← Retour à la connexion</a>
    </p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://alpzagoprkpzirgtrdup.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFscHphZ29wcmtwemlyZ3RyZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTg2MDEsImV4cCI6MjA5MjM3NDYwMX0.R7R6esDFce1W4k_wK-aBtAG20oUtK2SmSNCVKENS91g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const stateMsg = document.getElementById('stateMsg');
const resetForm = document.getElementById('resetForm');
let ready = false;

function showForm() {
  if (ready) return;
  ready = true;
  stateMsg.style.display = 'none';
  resetForm.style.display = 'block';
  document.getElementById('pwd1').focus();
}
function showInvalid() {
  if (ready) return;
  stateMsg.textContent = "Ce lien est invalide ou expiré. Redemandez un email depuis la page de connexion.";
}

// supabase-js détecte automatiquement le jeton de récupération dans l'URL et
// émet l'évènement PASSWORD_RECOVERY : c'est là qu'on autorise le changement.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') showForm();
  else if (session && session.user) showForm();
});

// Filet de sécurité : si l'évènement a déjà été consommé au chargement.
setTimeout(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) showForm();
  else showInvalid();
}, 1400);

async function handleReset(e) {
  e.preventDefault();
  const p1 = document.getElementById('pwd1').value;
  const p2 = document.getElementById('pwd2').value;
  const btn = document.getElementById('resetBtn');
  const err = document.getElementById('resetErr');
  err.style.display = 'none';
  err.style.color = '#c8433f';

  if (p1.length < 6) { err.textContent = "Le mot de passe doit faire au moins 6 caractères."; err.style.display = 'block'; return; }
  if (p1 !== p2) { err.textContent = "Les deux mots de passe ne correspondent pas."; err.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  const { error } = await sb.auth.updateUser({ password: p1 });

  if (error) {
    err.textContent = "Impossible d'enregistrer. Le lien a peut-être expiré — redemandez un email.";
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Enregistrer →';
    return;
  }

  stateMsg.style.display = 'block';
  stateMsg.style.color = '#3a9d5d';
  stateMsg.textContent = "Mot de passe mis à jour ! Redirection vers la connexion…";
  resetForm.style.display = 'none';
  setTimeout(() => { window.location.href = 'auth.html'; }, 1600);
}
</script>
</body>
</html>
